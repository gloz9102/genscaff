name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0

      - name: Validate skill structure
        run: python tools/check_skill.py

      - name: Install audit dependencies
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: npm ci --omit=dev

      - name: Audit production dependencies
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install Chromium
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: npx playwright install --with-deps chromium

      - name: Export Chromium path
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: node -e "console.log('CHROME_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run deterministic repository tests
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Run core tests
        working-directory: plugins/genscaff/skills/genscaff/scripts
        run: python test_quality_gate.py

      - name: Smoke-test marketplace installation
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/genscaff-codex-home"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          codex plugin add genscaff@genscaff-public --json
          test -f "$CODEX_HOME/plugins/cache/genscaff-public/genscaff/2.0.0/skills/genscaff/SKILL.md"
          test -f "$CODEX_HOME/plugins/cache/genscaff-public/genscaff/2.0.0/skills/genscaff-release-audit/SKILL.md"
          grep -R "allow_implicit_invocation: false" "$CODEX_HOME/plugins/cache/genscaff-public/genscaff/2.0.0/skills" | grep -q genscaff-release-audit

      - name: Run release-audit regression tests
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: python test_quality_gate.py

      - name: Build installable archive
        run: python tools/package_skill.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genscaff-v2-packages
          path: |
            dist/genscaff-plugin.zip
            dist/genscaff-plugin.zip.sha256
            dist/genscaff-legacy.zip
            dist/genscaff-legacy.zip.sha256
            dist/genscaff-eval-v2.0.0.zip
            dist/genscaff-eval-v2.0.0.zip.sha256
            dist/genscaff-eval-v2.0.0-summary.json
