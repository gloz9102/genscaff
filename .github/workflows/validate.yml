name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Validate skill structure
        run: python tools/check_skill.py

      - name: Install audit dependencies
        working-directory: skill/genscaff/scripts
        run: npm install --omit=dev

      - name: Install Chromium
        working-directory: skill/genscaff/scripts
        run: npx playwright install --with-deps chromium

      - name: Export Chromium path
        working-directory: skill/genscaff/scripts
        run: node -e "console.log('CHROME_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run regression tests
        working-directory: skill/genscaff/scripts
        run: python test_quality_gate.py

      - name: Build installable archive
        run: python tools/package_skill.py

      - uses: actions/upload-artifact@v4
        with:
          name: genscaff-skill
          path: |
            dist/genscaff.zip
            dist/genscaff.zip.sha256
