name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Validate skill structure
        run: python tools/check_skill.py

      - name: Install audit dependencies
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: npm ci --omit=dev

      - name: Audit production dependencies
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install Chromium
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: npx playwright install --with-deps chromium

      - name: Export Chromium path
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: node -e "console.log('CHROME_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run deterministic repository tests
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Run core tests
        working-directory: plugins/genscaff/skills/genscaff/scripts
        run: python test_quality_gate.py

      - name: Run release-audit regression tests
        working-directory: plugins/genscaff/skills/genscaff-release-audit/scripts
        run: python test_quality_gate.py

      - name: Build installable archive
        run: python tools/package_skill.py

      - uses: actions/upload-artifact@v4
        with:
          name: genscaff-v2-packages
          path: |
            dist/genscaff-plugin.zip
            dist/genscaff-plugin.zip.sha256
            dist/genscaff-legacy.zip
            dist/genscaff-legacy.zip.sha256
