<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="동일한 NOON PC 웹사이트 요구사항에 Genscaff 적용 여부만 달리한 비교">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <title>NOON PC · Genscaff 비교</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { max-width: 1440px; margin: auto; padding: 40px 24px 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px,4vw,48px); letter-spacing: -.05em; }
    p { margin: 0; color: #6e6e73; line-height: 1.6; }
    main { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; padding: 0 16px 24px; }
    article { min-width: 0; border-top: 1px solid #d2d2d7; }
    .bar { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h2 { margin: 0; font-size: 16px; }
    a { color: #0066cc; font-size: 14px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    iframe { display: block; width: 100%; height: 820px; border: 1px solid #d2d2d7; background: #fff; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } iframe { height: 720px; } }
  </style>
</head>
<body>
  <header>
    <h1>같은 요구사항, 다른 작업 방식</h1>
    <p>동일한 PC방 프랜차이즈 브리프와 이미지로 제작했습니다. 차이는 Genscaff Standard 적용 여부뿐입니다.</p>
  </header>
  <main>
    <article>
      <div class="bar"><h2>Genscaff Standard</h2><a href="with-genscaff/">전체 화면</a></div>
      <iframe src="with-genscaff/" title="Genscaff Standard 적용 결과"></iframe>
    </article>
    <article>
      <div class="bar"><h2>Control</h2><a href="without-genscaff/">전체 화면</a></div>
      <iframe src="without-genscaff/" title="Genscaff 미적용 결과"></iframe>
    </article>
  </main>
</body>
</html>
